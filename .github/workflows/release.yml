name: Release Builds

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build-linux:
    runs-on: ubuntu-latest
    container:
      image: ubuntu:22.04
    steps:
      - name: Install system dependencies
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y curl ca-certificates git build-essential pkg-config libssl-dev libgtk-3-dev \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev \
            libfontconfig1-dev libwayland-dev libx11-dev libgl1-mesa-dev libdbus-1-dev

      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Install cargo-deb
        run: cargo install cargo-deb --locked

      - name: Build .deb and tarball
        run: |
          cargo deb --locked
          mkdir -p dist
          cp target/debian/*.deb dist/
          tar -czf dist/mysql-rusty-linux-x86_64.tar.gz -C target/release mysql-rusty

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-artifacts
          path: dist/*

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Build Windows release binary
        run: cargo build --release --locked

      - name: Package Windows executable
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item target/release/mysql-rusty.exe dist/mysql-rusty-windows-x86_64.exe
          Compress-Archive -Path target/release/mysql-rusty.exe -DestinationPath dist/mysql-rusty-windows-x86_64.zip -Force

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-artifacts
          path: dist/*

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Build macOS release binary
        run: cargo build --release --locked

      - name: Package macOS .app and .dmg
        run: |
          mkdir -p dist "dist/MySQL-Rusty.app/Contents/MacOS" "dist/MySQL-Rusty.app/Contents/Resources"
          cp target/release/mysql-rusty "dist/MySQL-Rusty.app/Contents/MacOS/mysql-rusty"
          cp assets/icon.png "dist/MySQL-Rusty.app/Contents/Resources/icon.png"
          cat << 'EOF' > "dist/MySQL-Rusty.app/Contents/Info.plist"
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key>
            <string>MySQL-Rusty</string>
            <key>CFBundleDisplayName</key>
            <string>MySQL-Rusty</string>
            <key>CFBundleIdentifier</key>
            <string>com.juancastingo.mysql-rusty</string>
            <key>CFBundleVersion</key>
            <string>0.1.0</string>
            <key>CFBundlePackageType</key>
            <string>APPL</string>
            <key>CFBundleExecutable</key>
            <string>mysql-rusty</string>
            <key>NSHighResolutionCapable</key>
            <true/>
          </dict>
          </plist>
          EOF
          hdiutil create -volname "MySQL-Rusty" -srcfolder "dist/MySQL-Rusty.app" -ov -format UDZO dist/mysql-rusty-macos-arm64.dmg
          rm -rf "dist/MySQL-Rusty.app"

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-artifacts
          path: dist/*

  publish-release:
    needs: [build-linux, build-windows, build-macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read crate version
        id: meta
        run: echo "version=$(grep -m1 '^version =' Cargo.toml | cut -d'\"' -f2)" >> "$GITHUB_OUTPUT"

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-files
          merge-multiple: true

      - name: Publish latest pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "v${{ steps.meta.outputs.version }} (main)"
          prerelease: true
          overwrite_files: true
          files: release-files/*

  publish-apt:
    needs: [build-linux]
    runs-on: ubuntu-latest
    steps:
      - name: Check GPG secret
        id: check
        env:
          APT_GPG_PRIVATE_KEY: ${{ secrets.APT_GPG_PRIVATE_KEY }}
        run: |
          if [ -z "$APT_GPG_PRIVATE_KEY" ]; then
            echo "::warning::APT_GPG_PRIVATE_KEY secret is not configured. Skipping APT repository publishing."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout repository
        if: steps.check.outputs.enabled == 'true'
        uses: actions/checkout@v4

      - name: Download Linux artifacts
        if: steps.check.outputs.enabled == 'true'
        uses: actions/download-artifact@v4
        with:
          name: linux-artifacts
          path: incoming-debs

      - name: Install APT & GPG tools
        if: steps.check.outputs.enabled == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev apt-utils gnupg

      - name: Import GPG key
        if: steps.check.outputs.enabled == 'true'
        env:
          APT_GPG_PRIVATE_KEY: ${{ secrets.APT_GPG_PRIVATE_KEY }}
          APT_GPG_PASSPHRASE: ${{ secrets.APT_GPG_PASSPHRASE }}
        run: |
          echo "$APT_GPG_PRIVATE_KEY" | gpg --batch --import
          KEY_FP=$(gpg --list-secret-keys --with-colons | awk -F: '$1 == "fpr" { print $10; exit }')
          echo "KEY_FP=$KEY_FP" >> "$GITHUB_ENV"
          if [ -n "$APT_GPG_PASSPHRASE" ]; then
            echo "$APT_GPG_PASSPHRASE" > /tmp/gpg-passphrase
          fi

      - name: Build and push APT repository to gh-pages
        if: steps.check.outputs.enabled == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if git ls-remote --exit-code --heads origin gh-pages >/dev/null 2>&1; then
            git fetch origin gh-pages
            git checkout -B gh-pages origin/gh-pages
          else
            git checkout --orphan gh-pages
            git rm -rf . >/dev/null 2>&1 || true
          fi

          mkdir -p pool/main dists/stable/main/binary-amd64
          cp incoming-debs/*.deb pool/main/

          dpkg-scanpackages --multiversion pool/ > dists/stable/main/binary-amd64/Packages
          gzip -k -f dists/stable/main/binary-amd64/Packages

          apt-ftparchive \
            -o APT::FTPArchive::Release::Origin="mysql-rusty" \
            -o APT::FTPArchive::Release::Label="mysql-rusty" \
            -o APT::FTPArchive::Release::Suite="stable" \
            -o APT::FTPArchive::Release::Codename="stable" \
            -o APT::FTPArchive::Release::Architectures="amd64" \
            -o APT::FTPArchive::Release::Components="main" \
            release dists/stable > dists/stable/Release

          GPG_OPTS=(--batch --yes --pinentry-mode loopback)
          if [ -f /tmp/gpg-passphrase ]; then
            GPG_OPTS+=(--passphrase-file /tmp/gpg-passphrase)
          fi

          gpg "${GPG_OPTS[@]}" --local-user "$KEY_FP" --armor --detach-sign -o dists/stable/Release.gpg dists/stable/Release
          gpg "${GPG_OPTS[@]}" --local-user "$KEY_FP" --clearsign -o dists/stable/InRelease dists/stable/Release
          gpg --batch --yes --armor --export "$KEY_FP" > KEY.gpg

          rm -rf incoming-debs /tmp/gpg-passphrase

          git add pool dists KEY.gpg
          if ! git diff --cached --quiet; then
            git commit -m "Update APT repository"
            git push origin gh-pages
          else
            echo "No changes to APT repository."
          fi

