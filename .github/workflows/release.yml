name: Release Builds

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libssl-dev libgtk-3-dev \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev \
            libfontconfig1-dev libwayland-dev libx11-dev libgl1-mesa-dev libdbus-1-dev

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Install cargo-deb
        run: cargo install cargo-deb --locked

      - name: Build .deb and tarball
        run: |
          cargo deb --locked
          mkdir -p dist
          cp target/debian/*.deb dist/
          tar -czf dist/mysql-rusty-linux-x86_64.tar.gz -C target/release mysql-rusty

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-artifacts
          path: dist/*

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Build Windows release binary
        run: cargo build --release --locked

      - name: Package Windows executable
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item target/release/mysql-rusty.exe dist/mysql-rusty-windows-x86_64.exe
          Compress-Archive -Path target/release/mysql-rusty.exe -DestinationPath dist/mysql-rusty-windows-x86_64.zip -Force

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-artifacts
          path: dist/*

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Build macOS release binary
        run: cargo build --release --locked

      - name: Package macOS .app and .dmg
        run: |
          mkdir -p dist "dist/MySQL-Rusty.app/Contents/MacOS" "dist/MySQL-Rusty.app/Contents/Resources"
          cp target/release/mysql-rusty "dist/MySQL-Rusty.app/Contents/MacOS/mysql-rusty"
          cp assets/icon.png "dist/MySQL-Rusty.app/Contents/Resources/icon.png"
          cat << 'EOF' > "dist/MySQL-Rusty.app/Contents/Info.plist"
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key>
            <string>MySQL-Rusty</string>
            <key>CFBundleDisplayName</key>
            <string>MySQL-Rusty</string>
            <key>CFBundleIdentifier</key>
            <string>com.juancastingo.mysql-rusty</string>
            <key>CFBundleVersion</key>
            <string>0.1.0</string>
            <key>CFBundlePackageType</key>
            <string>APPL</string>
            <key>CFBundleExecutable</key>
            <string>mysql-rusty</string>
            <key>NSHighResolutionCapable</key>
            <true/>
          </dict>
          </plist>
          EOF
          hdiutil create -volname "MySQL-Rusty" -srcfolder "dist/MySQL-Rusty.app" -ov -format UDZO dist/mysql-rusty-macos-arm64.dmg
          rm -rf "dist/MySQL-Rusty.app"

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-artifacts
          path: dist/*

  publish-release:
    needs: [build-linux, build-windows, build-macos]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-files
          merge-multiple: true

      - name: Publish latest pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Latest Build (main)"
          prerelease: true
          overwrite_files: true
          files: release-files/*
