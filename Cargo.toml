[package]
name = "mysql-rusty"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Modern native MySQL/MariaDB Workbench alternative in Rust with AI autocomplete & CLI assistant"
authors = ["juancastingo"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/juancastingo/mysql-rusty"
homepage = "https://github.com/juancastingo/mysql-rusty"
readme = "README.md"
keywords = ["mysql", "mariadb", "sql", "database", "gui"]
categories = ["database", "development-tools", "gui"]

[dependencies]
eframe = { version = "0.37.0", default-features = false, features = [
    "default_fonts",
    "glow",
    "persistence",
    "wayland",
    "x11",
    "clipboard",
    "links",
] }
egui = { version = "0.37.0", features = ["monochrome_emoji_fonts"] }
egui_extras = { version = "0.37.0", features = ["all_loaders"] }
mysql_async = { version = "0.37.1", default-features = false, features = ["default-rustls-ring"] }
tokio = { version = "1.43", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
csv = "1.3"
dirs = "6.0"
uuid = { version = "1.11", features = ["v4", "serde"] }
rfd = "0.15"
keyring = "4.2.0"
egui_plot = "0.38.0"
sqlformat = "0.5.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tracing-appender = "0.2"
rusqlite = { version = "0.32", features = ["bundled"] }
regex = "1"
resvg = "0.45"
tiny-skia = "0.11"
tokio-postgres = "0.7"
deadpool-postgres = "0.14"
tokio-postgres-rustls = "0.13"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
webpki-roots = "1.0"
rust-i18n = "3"
sys-locale = "0.3"

[dev-dependencies]
insta = { version = "1", features = ["yaml"] }
serde_yaml = "0.9"

[package.metadata.deb]
maintainer = "juancastingo"
copyright = "2026, juancastingo"
section = "database"
priority = "optional"
depends = "$auto"
assets = [
    ["target/release/mysql-rusty", "usr/bin/", "755"],
    ["assets/mysql-rusty.desktop", "usr/share/applications/", "644"],
    ["assets/icon.png", "usr/share/pixmaps/mysql-rusty.png", "644"],
]

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
